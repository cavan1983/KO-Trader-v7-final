name: KO Trader V8 MACRO + FRED

on:
  schedule:
    # Bakı: 17:30 - 00:00 (Qış) / 16:30 - 23:00 (Yay)
    # UTC:  13:30 - 20:00 (həmişə sabit)
    # NY:   9:30 - 16:00 (həmişə sabit)
    - cron: '30 13 * * 1-5'      # 17:30 Bakı / 13:30 UTC / 9:30 ET
    - cron: '0,30 14-19 * * 1-5' # 18:00-23:30 Bakı / 14:00-19:30 UTC / 10:00-15:30 ET
    - cron: '0 20 * * 1-5'       # 00:00 Bakı (sonrakı gün) / 20:00 UTC / 16:00 ET
  workflow_dispatch:

concurrency:
  group: ko-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/
          key: ko-trader-v8-data-${{ runner.os }}
          restore-keys: |
            ko-trader-v8-data-
            ko-trader-v8-

      - name: Run KO Trader V8
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python robot.py
          echo "✅ KO V8 completed"

      - name: Check generated files
        run: |
          echo "📂 Data directory contents:"
          ls -lh data/ 2>/dev/null || echo "⚠️ data/ not found"
          echo "📄 JSON files:"
          ls -1 data/*.json 2>/dev/null || echo "⚠️ no JSON files"
          echo "📊 CSV files:"
          ls -1 data/*.csv 2>/dev/null || echo "⚠️ no CSV files"

      - name: Commit and push to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/*.json data/*.csv 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi
          
          git commit -m "🤖 V8 auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')" || exit 1
          git push origin main || {
            echo "⚠️ Push failed, trying pull --rebase..."
            git pull --rebase origin main
            git push origin main
          }
          echo "✅ Push completed"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predictions-v8-${{ github.run_number }}
          path: data/
          retention-days: 7

      - name: Workflow summary
        if: always()
        run: |
          echo "## 🤖 KO Trader V8 Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Completed" >> $GITHUB_STEP_SUMMARY   işvaxtı run olmur

Today
Sənin yml düzdür, amma GitHub-da iş vaxtı run olmamağın 2 əsas səbəbi var — səninki 60 gün qaydasıdır.

Sənin cron-ların:

30 13 * * 1-5 = 17:30 Bakı
0,30 14-19 = 18:00-23:30 Bakı
0 20 = 00:00 Bakı
Məntiq doğru: 13:30-20:00 UTC = 9:30-16:00 NY — birja vaxtı.

Niyə run olmur?

GitHub schedule-i yatızdırır: Əgər repo-da 60 gün heç bir commit/push olmasa, GitHub schedule trigger-lərini avtomatik söndürür. Sənin log-un yaşıl idi, deməli əl ilə Run workflow etmisən.
File main-də deyil: Bu .yml faylı main branch-də olmalıdır. Başqa branch-dədirsə schedule işləmir.
Actions disabled: Repo > Actions tab > sənin workflow > yuxarıda ... > Enable workflow yoxla.
