name: KO Trader V8 MACRO + FRED

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      # DÜZƏLİŞ: data cache-ini sildik, yalnız modelləri cache edirik
      - name: Restore models cache
        uses: actions/cache@v4
        with:
          path: |
            brain_*.keras
            scaler_*.pkl
          key: ko-models-${{ hashFiles('requirements.txt') }}
          restore-keys: ko-models-

      - name: Run KO V8
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python robot.py

      - name: Commit predictions to repo
        run: |
          mkdir -p data
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase
          git add -f data/predictions.json data/decision_journal.csv data/macro_cache.json data/fred_cache.json data/news_cache.json || true
          git diff --staged --name-only
          git commit -m "V8+FRED auto-update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push
