name: KO Trader V8 MACRO + FRED

on:
  schedule:
        - cron: '0 * * * *'   # hər saatın 00-da
        - cron: '30 * * * *'  # və 30-da = hər 30 dəq bir dəfə (45 dəq GitHub-da mümkün deyil)
  workflow_dispatch:

concurrency:
  group: ko-trader
  cancel-in-progress: true

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
            - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

            - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

            - name: Install deps
        run: pip install -r requirements.txt

            - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: ko-trader-v8-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ko-trader-v8-

            - name: Run KO V8
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python robot.py

            - name: Commit predictions
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f data/*.json data/*.csv || true
          git diff --staged --quiet || git commit -m "V8 auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase && git push || echo "push fail"
