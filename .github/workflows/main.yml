Sənə 1 dənə yoxla() funksiyası qoyuram — editdən sonra onu çağırırsan, bütün səfləri deyir.

robot.py-nin ən altına, if **name** == "**main**": dən əvvəl bunu əlavə et:

Python
def yoxla():
    """Kodu editdən sonra yoxlamaq üçün"""
    import py_compile, sys, ast, os
    print("🔍 Yoxlama başlayır...")
    errors = []

    # 1. Syntax yoxlaması
    try:
        py_compile.compile("robot.py", doraise=True)
        print("✅ Syntax OK")
    except py_compile.PyCompileError as e:
        print(f"❌ Syntax səfi: {e}")
        return False

    # 2. Boşluq və f-string səfi
    try:
        with open("robot.py","r",encoding="utf-8") as f:
            src = f.read()
        # \n\n dan sonra boşluq
        if "\n\n " in src:
            print("⚠️ Xəbərdarlıq: \\n\\n dən sonra artıq boşluq var - 440-cı sətir kimi")
        # f-string içində {{ }} səfi
        ast.parse(src)
        print("✅ AST OK")
    except Exception as e:
        print(f"❌ Parse səfi: {e}")
        errors.append(str(e))

    # 3. Vacib funksiyalar var?
    for fn in ["fetch_data","prepare_xy","train_model","main","send_telegram","journal_yaz"]:
        if f"def {fn}" not in src:
            print(f"❌ Funksiya yoxdur: {fn}")
            errors.append(fn)
        else:
            print(f"✅ {fn} var")

    # 4. Msg disclaimer varmı?
    if "Təhsil üçündür" in src:
        print("✅ Disclaimer var")
    else:
        print("⚠️ Disclaimer yoxdur")

    if not errors:
        print("\n🎉 Hər şey OK - push edə bilərsən!")
        return True
    else:
        print(f"\n❌ {len(errors)} səf tapıldı")
        return False

