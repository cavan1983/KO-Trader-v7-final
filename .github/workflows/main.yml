name: KO Trader V8 MACRO + FRED

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: ko-trader-v8-${{ runner.os }}
          restore-keys: ko-trader-v8-

      - name: Run KO V8
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python robot.py

      - name: Commit predictions to repo
        run: |
          mkdir -p data
          ls -lh data/ || echo "data bosdur"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f data/*.json data/*.csv || echo "add fail"
          git diff --staged --name-only
          git commit -m "V8+FRED auto-update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push || echo "Push failed, trying pull --rebase"; git pull --rebase && git push

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predictions-v8
          path: data/
          retention-days: 7
